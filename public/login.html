<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SevnHub - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green-400: #34d399;
      --green-500: #10b981;
      --green-600: #059669;
      --green-700: #047857;
      --green-glow: rgba(16, 185, 129, 0.15);
      --green-glow-strong: rgba(16, 185, 129, 0.35);
      --green-subtle: rgba(16, 185, 129, 0.06);
      --bg-deep: #060a08;
      --bg-card: rgba(10, 18, 14, 0.75);
      --border-subtle: rgba(52, 211, 153, 0.08);
      --border-hover: rgba(52, 211, 153, 0.2);
      --text-primary: #f0fdf4;
      --text-secondary: #86efac;
      --text-muted: #4b6a58;
      --text-dim: #365244;
    }

    body {
      min-height: 100vh;
      background: var(--bg-deep);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      position: relative;
      overflow: hidden;
    }

    /* Layered background effects */
    .bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Main radial glow - top */
    .bg-layer::before {
      content: '';
      position: absolute;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0.03) 40%, transparent 70%);
      animation: breatheGlow 6s ease-in-out infinite;
    }

    /* Secondary glow - bottom left */
    .bg-layer::after {
      content: '';
      position: absolute;
      bottom: -20%;
      left: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(5, 150, 105, 0.08) 0%, transparent 60%);
      animation: breatheGlow 8s ease-in-out infinite reverse;
    }

    @keyframes breatheGlow {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
    }

    /* Grid pattern overlay */
    .grid-pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(16, 185, 129, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 40%, black 20%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 40%, black 20%, transparent 70%);
    }

    /* Floating particles canvas */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Content wrapper */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Brand text */
    .brand {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--text-muted);
      margin-bottom: 36px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 16px;
      font-weight: 500;
      animation: fadeSlideDown 0.8s ease-out both;
    }

    .brand::before,
    .brand::after {
      content: '';
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--text-dim), transparent);
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 52px 44px 44px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      backdrop-filter: blur(40px) saturate(1.4);
      -webkit-backdrop-filter: blur(40px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(16, 185, 129, 0.04),
        0 4px 24px rgba(0, 0, 0, 0.4),
        0 24px 80px -12px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
      position: relative;
      overflow: hidden;
      animation: cardEntry 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .card:hover {
      border-color: var(--border-hover);
      box-shadow:
        0 0 0 1px rgba(16, 185, 129, 0.08),
        0 4px 24px rgba(0, 0, 0, 0.4),
        0 24px 80px -12px rgba(0, 0, 0, 0.6),
        0 0 60px -20px rgba(16, 185, 129, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    /* Animated shimmer on card top edge */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--green-400), transparent);
      animation: shimmer 4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { left: -60%; }
      100% { left: 160%; }
    }

    /* Subtle green tint at top of card */
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 120px;
      background: radial-gradient(ellipse, rgba(16, 185, 129, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    @keyframes cardEntry {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* Logo container */
    .logo {
      width: 76px;
      height: 76px;
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.1), rgba(6, 10, 8, 0.9));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      border: 1px solid rgba(16, 185, 129, 0.12);
      position: relative;
      z-index: 1;
      box-shadow: 0 8px 32px -8px rgba(16, 185, 129, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 40px -8px rgba(16, 185, 129, 0.3);
    }

    .logo svg {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.4));
    }

    /* Heading */
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f0fdf4, #bbf7d0, #6ee7b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 36px;
      position: relative;
      z-index: 1;
    }

    .subtitle a {
      color: var(--green-400);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
      position: relative;
    }

    .subtitle a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--green-400);
      transition: width 0.3s ease;
    }

    .subtitle a:hover {
      color: #6ee7b7;
    }

    .subtitle a:hover::after {
      width: 100%;
    }

    /* Discord button */
    .discord-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      width: 100%;
      background: linear-gradient(135deg, var(--green-600), var(--green-700));
      color: white;
      border: none;
      border-radius: 14px;
      padding: 15px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      font-family: inherit;
      position: relative;
      z-index: 1;
      overflow: hidden;
      letter-spacing: 0.1px;
      box-shadow:
        0 2px 8px rgba(5, 150, 105, 0.3),
        0 8px 24px -4px rgba(5, 150, 105, 0.25);
    }

    .discord-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--green-500), var(--green-600));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .discord-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 4px 12px rgba(5, 150, 105, 0.4),
        0 16px 40px -8px rgba(5, 150, 105, 0.35);
    }

    .discord-btn:hover::before {
      opacity: 1;
    }

    .discord-btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow:
        0 1px 4px rgba(5, 150, 105, 0.3),
        0 4px 12px -2px rgba(5, 150, 105, 0.2);
    }

    .discord-btn svg,
    .discord-btn span {
      position: relative;
      z-index: 1;
    }

    .discord-btn svg {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 28px;
      position: relative;
      z-index: 1;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-subtle), transparent);
    }

    .divider span {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 500;
    }

    /* Social row */
    .social-row {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      position: relative;
      z-index: 1;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(16, 185, 129, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }

    .social-btn:hover {
      background: rgba(16, 185, 129, 0.08);
      border-color: var(--border-hover);
      color: var(--text-secondary);
      transform: translateY(-1px);
    }

    .social-btn:active {
      transform: translateY(0);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Footer text */
    .footer-text {
      margin-top: 36px;
      font-size: 12.5px;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.7;
      max-width: 380px;
      animation: fadeSlideDown 0.8s ease-out 0.5s both;
    }

    .footer-text a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
      border-bottom: 1px solid transparent;
    }

    .footer-text a:hover {
      color: var(--green-400);
      border-bottom-color: var(--green-400);
    }

    /* Vertical copyright */
    .copyright {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%) rotate(180deg);
      font-size: 11px;
      color: var(--text-dim);
      writing-mode: vertical-rl;
      letter-spacing: 2px;
      font-weight: 500;
      opacity: 0.5;
    }

    /* Status indicator */
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      position: relative;
      z-index: 1;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green-500);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(16, 185, 129, 0.6); }
      50% { opacity: 0.5; box-shadow: 0 0 16px rgba(16, 185, 129, 0.3); }
    }

    .status span {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* Music button */
    .music-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(10, 18, 14, 0.8);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-dim);
      transition: all 0.3s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
    }

    .music-btn:hover {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--border-hover);
      color: var(--green-400);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
    }

    .music-btn.playing {
      color: var(--green-400);
      border-color: rgba(16, 185, 129, 0.3);
      animation: musicPulse 1.5s ease-in-out infinite;
    }

    @keyframes musicPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.2); }
      50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    }

    /* Fade in animation */
    @keyframes fadeSlideDown {
      0% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(10, 18, 14, 0.9);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      z-index: 100;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green-500);
      flex-shrink: 0;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 480px) {
      .card {
        margin: 0 16px;
        padding: 40px 28px 36px;
      }
      .copyright {
        display: none;
      }
      h1 {
        font-size: 22px;
      }
      .social-btn span {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="grid-pattern"></div>
  <canvas id="particles"></canvas>

  <!-- Toast notification -->
  <div class="toast" id="toast">
    <div class="toast-dot"></div>
    <span id="toastMsg">All systems operational</span>
  </div>

  <div class="content">
    <div class="brand">SEVNHUB</div>

      </div>

      <div class="status">
        <div class="status-dot"></div>
        <span>All systems online</span>
      </div>
    </div>

    <p class="footer-text">
      Need an account? Signing in with Discord creates one automatically.<br>
      By continuing, you agree to our <a href="/privacy">Privacy Policy</a>.
    </p>
  </div>

  <div class="copyright">SEVNHUB &copy; 2026</div>

  <button class="music-btn" id="musicBtn" title="Toggle ambient music" aria-label="Toggle ambient music">
    <svg id="musicIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  </button>

  <script>
    /* ── Floating particles ── */
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.size = Math.random() * 1.5 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3 - 0.15;
        this.opacity = Math.random() * 0.4 + 0.1;
        this.fadeSpeed = Math.random() * 0.003 + 0.001;
        this.growing = Math.random() > 0.5;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.growing) {
          this.opacity += this.fadeSpeed;
          if (this.opacity >= 0.5) this.growing = false;
        } else {
          this.opacity -= this.fadeSpeed;
          if (this.opacity <= 0.05) this.reset();
        }

        if (this.x < -10 || this.x > w + 10 || this.y < -10 || this.y > h + 10) {
          this.reset();
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(52, 211, 153, ${this.opacity})`;
        ctx.fill();
      }
    }

    // Create particles based on screen size
    const count = Math.min(Math.floor((w * h) / 12000), 120);
    for (let i = 0; i < count; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, w, h);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* ── Card tilt effect ── */
    const card = document.getElementById('card');
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -3;
      const rotateY = ((x - centerX) / centerX) * 3;
      card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(800px) rotateX(0) rotateY(0)';
      card.style.transition = 'transform 0.5s ease';
      setTimeout(() => { card.style.transition = ''; }, 500);
    });

    card.addEventListener('mouseenter', () => {
      card.style.transition = 'none';
    });

    /* ── Music toggle ── */
    const musicBtn = document.getElementById('musicBtn');
    let isPlaying = false;

    // Create simple ambient tone using Web Audio API
    let audioCtx = null;
    let gainNode = null;
    let oscillators = [];

    function createAmbientSound() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.connect(audioCtx.destination);

      // Layered soft tones for ambient feel
      const frequencies = [130.81, 196.00, 261.63, 329.63];
      frequencies.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        oscGain.gain.setValueAtTime(0.03 / (i + 1), audioCtx.currentTime);
        osc.connect(oscGain);
        oscGain.connect(gainNode);
        osc.start();
        oscillators.push({ osc, gain: oscGain });
      });
    }

    musicBtn.addEventListener('click', () => {
      if (!isPlaying) {
        if (!audioCtx) createAmbientSound();
        audioCtx.resume();
        gainNode.gain.linearRampToValueAtTime(0.6, audioCtx.currentTime + 1);
        musicBtn.classList.add('playing');
        isPlaying = true;
        showToast('Ambient sound enabled');
      } else {
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        musicBtn.classList.remove('playing');
        isPlaying = false;
        showToast('Ambient sound disabled');
      }
    });

    /* ── Toast system ── */
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    let toastTimeout = null;

    function showToast(msg) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastMsg.textContent = msg;
      toast.classList.add('show');
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Show initial toast
    setTimeout(() => showToast('All systems operational'), 1200);

    /* ── Login button feedback ── */
    document.getElementById('loginBtn').addEventListener('click', (e) => {
      // Allow the link to work normally; just show a brief visual
      const btn = e.currentTarget;
      btn.style.transform = 'scale(0.96)';
      setTimeout(() => { btn.style.transform = ''; }, 150);
    });
  </script>
</body>
</html>
